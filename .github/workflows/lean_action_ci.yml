name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
      - name: Check all case-study files
        run: ./run_files.sh Sal
