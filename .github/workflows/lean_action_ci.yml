name: Sal release gate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: false
          test: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the plain MRDT framework and runtime
        run: ./scripts/check-mrdt-refactor.sh
