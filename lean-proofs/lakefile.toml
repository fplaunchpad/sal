name = "leanproofs"
version = "0.1.0"

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

# The shared framework and metatheory, vendored from the paper artifact.
# These files are copies and are never edited here; artifact-provenance.json
# records their SHA-256 so drift from the artifact is detectable.
[[lean_lib]]
name = "Artifact"
globs = ["Artifact.*"]

[[lean_lib]]
name = "LeanProofs"
